name: dstore
description: Application DStore de gestion de stock
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase pour la base de données
  supabase_flutter: ^2.3.4

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  flutter_colorpicker: ^1.0.3

  # Navigation & état
  go_router: ^12.1.3
  provider: ^6.1.1

  # Scan code-barres
  mobile_scanner: ^5.2.3

  # Gestion images
  image_picker: ^1.0.7
  permission_handler: ^11.3.1
  cached_network_image: ^3.3.0

  # Caméra (desktop Windows)
  camera: ^0.11.0
  camera_windows: ^0.2.5

  # Fichiers / Excel
  excel: ^4.0.6
  file_picker: ^8.0.0+1
  archive: ^3.4.10

  # PDF & impression
  pdf: ^3.10.7
  printing: ^5.11.1

  # Email / HTTP
  mailer: ^6.0.1
  http: ^1.1.0

  # Stockage local
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # Partage & URL
  share_plus: ^7.2.1
  url_launcher: ^6.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.2.1
  path: ^1.8.3

  # Google Drive
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  google_sign_in: ^6.2.1

  # Charts
  fl_chart: ^0.65.0

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Responsive
  responsive_framework: ^1.1.1

  # Loading & animations
  shimmer: ^3.0.0
  lottie: ^2.7.0

  # Audio
  audioplayers: ^5.2.1

  # Barcode
  barcode: ^2.2.4
  barcode_widget: ^2.0.4

  # Device info
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2

  # Secure storage
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/sounds/

flutter_icons:
  android: true
  ios: true
  image_path: 'assets/images/dstore_icon.png'
  adaptive_icon_background: '#0BA3FF'
  adaptive_icon_foreground: 'assets/images/dstore_icon.png'
